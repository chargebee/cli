name: CB Secret PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Secret PR Scan
    # Dependabot PRs run with a read-only token and no repo secrets.
    if: github.actor != 'dependabot[bot]'
    # Inlined so this still runs after the repo is public. GitHub forbids a
    # public workflow from calling a reusable workflow stored in a private
    # repo (does not call the private cb-secrets-scanner reusable workflow).
    # Pattern matches chargebee/reference-architecture and
    # chargebee/cb-marketplace-sample-app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public Chargebee repos use GITLEAKS_LICENSE_PUBLIC. Fall back to
          # the org-wide private-repo license while this repo is still private.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE_PUBLIC || secrets.GITLEAKS_LICENSE }}
