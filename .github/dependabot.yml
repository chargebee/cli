# Keeps the SHA-pinned GitHub Actions and the Bun dependencies current.
# Actions are pinned to commit SHAs in the workflows; Dependabot rewrites the
# SHA and the trailing version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # OpenAPI reconciliation owns this bundled runtime dependency so its
    # version, generated commands, license, and notices move in one PR.
    ignore:
      - dependency-name: "@chargebee/code-sample-generator"
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "build"
